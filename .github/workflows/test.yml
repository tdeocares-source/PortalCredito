# GitHub Actions: corre typecheck + vitest en cada push y en cada PR a main.
# Cuando una corrida falle, GitHub bloquea el merge si la branch protection
# rule de main exige el check "Typecheck + Vitest".

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Si pusheás varios commits seguidos, cancela las corridas anteriores y deja
# solo la del último commit. Ahorra minutos de CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test
